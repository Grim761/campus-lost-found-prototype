<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="拾见校园：校园失物招领小程序交互原型">
  <title>拾见校园｜失物招领交互原型</title>
  <link rel=stylesheet href=style.css>
</head>
<body>
  <div class="site">
    <div class="top"><div class="brand"><span class="mark">拾</span><span>拾见校园</span></div><span class="tag">CAMPUS NOTICE / 交互原型</span></div>
    <main class="layout">
      <section class="intro">
        <div class="eyebrow">A PLACE FOR EVERY CLUE</div>
        <h1>每件失物，<br><em>都有回家的线索。</em></h1>
        <p>把散落在群聊里的寻物与招领信息，整理成一张张清楚的校园线索卡。点击手机原型，试试浏览、搜索、发布和状态更新。</p>
        <div class="flows">
          <button class="flow" data-flow="browse"><span class="flow-num">01</span><span><strong>沿着线索查看详情</strong><small>浏览招领信息，核对地点、时间与领取方式</small></span><span class="flow-arrow">→</span></button>
          <button class="flow" data-flow="search"><span class="flow-num">02</span><span><strong>用关键词寻找物品</strong><small>搜索“校园卡”，从结果进入详情</small></span><span class="flow-arrow">→</span></button>
          <button class="flow" data-flow="publish"><span class="flow-num">03</span><span><strong>贴出新的寻物或招领</strong><small>填写信息，查看发布反馈并更新状态</small></span><span class="flow-arrow">→</span></button>
        </div>
        <div class="footnote">拾见校园 / 需求分析与交互原型 · 所有物品信息均为演示数据</div>
      </section>
      <div class="device" aria-label="拾见校园交互原型">
        <div class="status"><span>9:41</span><span>●●● ▰</span></div>
        <div id="app" class="screen"></div>
      </div>
    </main>
  </div>
  <script>
    const seed = [
      {id:1,kind:"招领",title:"拾到一张校园卡",category:"证件卡片",place:"图书馆一楼服务台附近",date:"9月25日 15:30",short:"图书馆一楼",description:"卡片已交图书馆服务台保管。请失主描述卡面信息后领取，避免冒领。",contact:"图书馆一楼服务台",status:"招领中"},
      {id:2,kind:"寻物",title:"寻找黑色无线耳机",category:"电子产品",place:"第三教学楼附近",date:"9月25日 11:10",short:"教学楼附近",description:"黑色充电盒，左耳耳机有一道小划痕。若捡到请通过学院失物招领点转交。",contact:"学院失物招领点",status:"寻找中"},
      {id:3,kind:"招领",title:"拾到一把蓝色雨伞",category:"其他",place:"第一食堂门口",date:"9月24日 18:20",short:"第一食堂门口",description:"折叠伞，深蓝色，伞柄有白色挂绳。",contact:"第一食堂服务台",status:"招领中"},
      {id:4,kind:"寻物",title:"寻找校园卡",category:"证件卡片",place:"第三教学楼",date:"9月24日 09:00",short:"第三教学楼",description:"9月24日上午在第三教学楼附近遗失。请联系学院失物招领点。",contact:"学院失物招领点",status:"寻找中"}
    ];
    const app=document.getElementById("app");
    let page="home", filter="全部", keyword="", selected=1, previousList="home", mine=[];
    function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
    function getPost(){return mine.concat(seed).find(p=>p.id===selected)||seed[0];}
    function nav(title,back){return '<div class="appbar">'+(back?'<button class="back" data-screen="'+back+'" aria-label="返回">‹</button>':"")+esc(title)+'</div>';}
    function bottom(active){return '<div class="bottomnav">'+[["home","⌂","首页"],["search","⌕","搜索"],["publish","＋","发布"],["mine","☷","我的"]].map(([key,icon,label])=>'<button data-screen="'+key+'" class="'+(active===key?"active":"")+'"'+(active===key?' aria-current="page"':'')+'><b aria-hidden="true">'+icon+'</b>'+label+'</button>').join("")+'</div>';}
    function iconFor(p){return p.category==="证件卡片"?"卡":p.category==="电子产品"?"耳":p.category==="钥匙"?"钥":"物";}
    function card(p){let lost=p.kind==="寻物",number=String(p.id).slice(-3).padStart(3,"0");return `<button class="card ${lost?"kind-lost":"kind-found"}" data-post="${p.id}"><span class="card-head"><span class="card-serial">NO. ${number}</span><span class="card-type">${esc(p.kind)} / ${esc(p.status)}</span></span><span class="card-main"><span class="card-icon" aria-hidden="true">${iconFor(p)}</span><span><span class="cardtitle">${esc(p.title)}</span><span class="meta">${esc(p.short)} · ${esc(p.date)}</span></span></span></button>`;}
    function home(){let posts=mine.concat(seed).filter(p=>filter==="全部"||p.kind===filter);return nav("拾见校园")+`<div class="body"><div class="hero"><span class="mini-label">THE CLUE BOARD · 2026</span><h2>好线索，会相遇。</h2><div class="muted">把寻物与招领，贴在同一面线索墙。</div><span class="hero-number" aria-hidden="true">拾</span></div><button class="searchlink" data-screen="search"><span class="search-glyph" aria-hidden="true">⌕</span>按物品名称寻找线索</button><div class="seg">${["全部","寻物","招领"].map(x=>`<button data-filter="${x}" class="${filter===x?"active":""}" aria-pressed="${filter===x}">${x}</button>`).join("")}</div><div class="section-head"><h3>线索墙上的新消息</h3><small>${String(posts.length).padStart(2,"0")} ITEMS</small></div><div class="list">${posts.map(card).join("")}</div><div class="actions"><button class="cta" data-screen="publish">＋ 贴出一条新线索</button></div></div>`+bottom("home");}
    function search(){return nav("搜索物品","home")+`<div class="body"><span class="mini-label">FIND A CLUE / 01</span><h2>从一个关键词开始。</h2><p class="muted">物品名称越具体，找到的线索越接近。</p><form id="search-form"><label class="sr-only" for="keyword">搜索物品名称</label><div class="searchrow"><span class="search-glyph" aria-hidden="true">⌕</span><input id="keyword" name="keyword" placeholder="例如：校园卡、钥匙" value="${esc(keyword)}" autocomplete="off"></div><div class="actions"><button class="cta" type="submit">查找线索</button></div></form><div class="section-head"><h3>试试这些物品</h3><small>QUICK SEARCH</small></div><div class="seg">${["校园卡","钥匙","雨伞"].map(x=>`<button data-keyword="${x}">${x}</button>`).join("")}</div><p class="muted" style="margin-top:27px">打开结果后，再核对地点、时间与物品特征。</p></div>`+bottom("search");}
    function results(){let q=keyword.trim().toLowerCase();let posts=mine.concat(seed).filter(p=>!q||[p.title,p.category,p.place,p.description].join(" ").toLowerCase().includes(q));return nav("搜索结果","search")+`<div class="body"><span class="mini-label">SEARCH RESULT / 02</span><button class="searchlink" data-screen="search" style="margin-top:13px"><span class="search-glyph" aria-hidden="true">⌕</span>${esc(keyword||"重新输入关键词")}</button><div class="result-heading"><span class="result-count">${String(posts.length).padStart(2,"0")}</span><span>条与“${esc(keyword||"全部物品")}”相关的线索</span></div><div class="list">${posts.length?posts.map(card).join(""):'<div class="empty">暂时没有匹配的线索。<br>试试更短的关键词，或贴出寻物信息。</div>'}</div><div class="actions"><button class="secondary" data-screen="publish">发布寻物信息</button></div></div>`+bottom("search");}
    function detail(){let p=getPost(),done=p.status.startsWith("已");return nav("线索详情",previousList)+`<div class="body"><span class="mini-label">CLUE FILE / ${esc(p.kind)}</span><h2 style="margin-top:12px">${esc(p.title)}</h2><span class="pill ${done?"closed":p.kind==="寻物"?"lost":""}">${esc(p.status)}</span><div class="photo"><div class="photo-token" aria-hidden="true">${iconFor(p)}</div><span>物品照片示意 · ${esc(p.category)}</span></div><div class="facts"><div class="fact"><b>类别</b><span>${esc(p.category)}</span></div><div class="fact"><b>地点</b><span>${esc(p.place)}</span></div><div class="fact"><b>时间</b><span>${esc(p.date)}</span></div></div><div class="section-head"><h3>这条线索还说了什么</h3><small>DETAIL</small></div><p class="muted">${esc(p.description)}</p><div class="actions">${done?'<div class="note">这条线索已经完成，无需再联系发布者。</div>':'<button class="cta" data-screen="contact">查看联系或领取方式</button>'}</div></div>`;}
    function contact(){let p=getPost(),lost=p.kind==="寻物";if(p.status.startsWith("已"))return nav("交接方式","detail")+'<div class="body"><span class="mini-label">CLUE CLOSED</span><h2>这条线索已完成</h2><p class="muted">物品已找回或归还，无需再联系发布者。</p><div class="actions"><button class="secondary" data-screen="detail">返回详情</button></div></div>';return nav("交接方式","detail")+`<div class="body"><span class="mini-label">A SAFE HANDOVER / 03</span><h2>${lost?'提供线索，协助归还':'核对物品后再领取'}</h2><p class="muted">${lost?'如果拾到相似物品，请先核对特征，再按下方方式提供线索。':'请先核对时间、地点和特征，再按下方方式领取。'}</p><div class="step-list"><div class="step"><b>01</b><span>查看物品信息，确认是否与自己寻找或拾到的物品一致。</span></div><div class="step"><b>02</b><span>按照发布者留下的方式联系或到指定地点交接。</span></div></div><div class="facts"><div class="fact"><b>交接方式</b><span>${esc(p.contact)}</span></div><div class="fact"><b>相关物品</b><span>${esc(p.title)}</span></div></div><div class="note" style="margin-top:21px">证件信息不公开完整卡面，交接时再核实，避免冒领。</div><div class="actions"><button class="secondary" data-screen="detail">返回线索详情</button></div></div>`;}
    function publish(){return nav("发布信息","home")+`<div class="body"><span class="mini-label">POST A CLUE / 04</span><h2>贴一张新的线索卡。</h2><p class="muted">把物品、地点和时间写清楚，方便对方判断。</p><form id="publish-form"><label class="field">线索类型<select name="kind"><option>寻物</option><option>招领</option></select></label><label class="field">物品名称 *<input name="title" placeholder="例如：校园卡" required maxlength="40"></label><label class="field">物品类别<select name="category"><option>证件卡片</option><option>钥匙</option><option>电子产品</option><option>其他</option></select></label><label class="field">丢失或拾取时间 *<input name="date" type="datetime-local" required></label><label class="field">地点 *<input name="place" placeholder="例如：图书馆一楼" required maxlength="50"></label><label class="field">补充描述<textarea name="description" placeholder="颜色、特征等；不要填写完整证件号" maxlength="200"></textarea></label><label class="field">联系或领取方式 *<input name="contact" placeholder="例如：交至服务台" required maxlength="60"></label><p class="help">带 * 的项目必填。本页只演示流程；刷新后记录会清除，也不会提交到服务器。</p><div id="form-error" class="error" role="alert"></div><div class="actions"><button class="cta" type="submit">确认贴出线索</button></div></form></div>`+bottom("publish");}
    function success(){return nav("发布成功")+'<div class="body center"><div class="symbol">✓</div><span class="mini-label">CLUE POSTED</span><h2 style="margin-top:12px">发布成功</h2><p class="muted">新线索已进入本次演示列表。物品找到或归还后，记得更新状态。</p><div class="actions" style="margin-top:58px"><button class="cta" data-screen="mine">查看我的线索</button><button class="secondary" data-screen="home">返回线索墙</button></div></div>';}
    function myPage(){return nav("我的发布","home")+`<div class="body"><span class="mini-label">MY CLUES / 05</span><h2>我贴出的线索。</h2><p class="muted">物品已找回或归还时，把这条信息标记为完成。</p><div class="list" style="margin-top:23px">${mine.length?mine.map(p=>card(p)+`<button class="secondary" style="margin-top:-5px" data-close="${p.id}" ${p.status.startsWith("已")?'disabled aria-disabled="true"':''}>${p.status.startsWith("已")?"已完成":"标记为"+(p.kind==="招领"?"已归还":"已找回")}</button>`).join(""):'<div class="empty">这面墙上还没有你的线索。<br>先发布一条寻物或招领信息吧。</div>'}</div><div class="actions"><button class="cta" data-screen="publish">贴出新线索</button></div></div>`+bottom("mine");}
    function closed(){return nav("状态已更新","mine")+'<div class="body center"><div class="symbol">✓</div><span class="mini-label">A CLUE COMPLETED</span><h2 style="margin-top:12px">状态已更新</h2><p class="muted">这条线索有了结局。列表会显示新的状态，减少无效联系。</p><div class="actions" style="margin-top:58px"><button class="cta" data-screen="mine">返回我的线索</button><button class="secondary" data-screen="home">返回线索墙</button></div></div>';}
    function render(){app.innerHTML=({home,search,results,detail,contact,publish,success,mine:myPage,closed}[page]||home)();app.scrollTop=0;document.title="拾见校园｜"+({home:"首页",search:"搜索",results:"搜索结果",detail:"线索详情",contact:"交接方式",publish:"发布信息",success:"发布成功",mine:"我的发布",closed:"状态已更新"}[page]||"交互原型");}
    function go(next){page=next;if(location.hash.slice(1)!==next)location.hash=next;render();}
    document.addEventListener("click",ev=>{let flow=ev.target.closest("[data-flow]");if(flow){if(flow.dataset.flow==="browse"){selected=1;previousList="home";go("detail");}if(flow.dataset.flow==="search"){keyword="校园卡";go("search");}if(flow.dataset.flow==="publish"){go("publish");}return;}let f=ev.target.closest("[data-filter]");if(f){filter=f.dataset.filter;render();return;}let k=ev.target.closest("[data-keyword]");if(k){keyword=k.dataset.keyword;go("results");return;}let p=ev.target.closest("[data-post]");if(p){selected=Number(p.dataset.post);previousList=page;go("detail");return;}let c=ev.target.closest("[data-close]");if(c){let item=mine.find(x=>x.id===Number(c.dataset.close));if(item&&item.status.indexOf("已")!==0){item.status=item.kind==="招领"?"已归还":"已找回";go("closed");}return;}let link=ev.target.closest("[data-screen]");if(link){go(link.dataset.screen);}});
    document.addEventListener("submit",ev=>{if(ev.target.id==="search-form"){ev.preventDefault();keyword=String(new FormData(ev.target).get("keyword")||"").trim();go("results");}if(ev.target.id==="publish-form"){ev.preventDefault();let d=new FormData(ev.target);let title=String(d.get("title")||"").trim(),place=String(d.get("place")||"").trim(),contact=String(d.get("contact")||"").trim();if(!title||!place||!contact||!d.get("date")){document.getElementById("form-error").textContent="请补全带 * 的项目。";return;}let kind=String(d.get("kind"));let rawDate=String(d.get("date"));let description=String(d.get("description")||"").trim()||"暂无补充描述";let item={id:Date.now(),kind,title,category:String(d.get("category")),place,date:rawDate.replace("T"," "),short:place,description,contact,status:kind==="招领"?"招领中":"寻找中"};mine.unshift(item);selected=item.id;go("success");}});
    window.addEventListener("hashchange",()=>{let target=location.hash.slice(1);if(target!==page&&["home","search","results","detail","contact","publish","success","mine","closed"].includes(target)){page=target;render();}});
    let initial=location.hash.slice(1);if(["home","search","results","detail","contact","publish","success","mine","closed"].includes(initial))page=initial;render();
  </script>
</body>
</html>
