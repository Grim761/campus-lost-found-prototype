title: 拾见校园 · 失物招领小程序原型
prototype:
  device: phone
  theme: light
  style: flat
  accent: green
screens:
  home:
    items:
      nav:       { widget: navbar, x: 0, y: 0, title: 拾见校园 }
      welcome:   { widget: heading, x: 24, y: 86, w: 342, text: 让失物更快回家 }
      lead:      { widget: paragraph, x: 24, y: 130, w: 342, text: 集中查看校园寻物与招领信息，少翻群消息。 }
      search:    { widget: searchbar, x: 24, y: 190, w: 342, placeholder: 搜索物品名称, goto: search }
      tabs:      { widget: segmented, x: 24, y: 252, w: 342, items: [全部, 寻物, 招领] }
      latest:    { widget: heading, x: 24, y: 320, w: 342, text: 最新信息 }
      card_1:    { widget: button, x: 24, y: 376, w: 342, h: 82, text: "招领 · 校园卡\n图书馆一楼拾到 · 今天", goto: detail }
      card_2:    { widget: button, x: 24, y: 474, w: 342, h: 82, text: "寻物 · 黑色耳机\n教学楼附近丢失 · 昨天", goto: detail }
      card_3:    { widget: button, x: 24, y: 572, w: 342, h: 82, text: "招领 · 蓝色雨伞\n第一食堂门口拾到 · 昨天", goto: detail }
      publish:   { widget: button, x: 24, y: 696, w: 342, text: ＋ 发布寻物或招领, goto: publish }
  search:
    items:
      nav:       { widget: navbar, x: 0, y: 0, title: 搜索物品, back: true, goto: home }
      heading:   { widget: heading, x: 24, y: 104, w: 342, text: 找到相关信息 }
      query:     { widget: searchbar, x: 24, y: 166, w: 342, placeholder: 输入校园卡、钥匙等 }
      search_go: { widget: button, x: 24, y: 232, w: 342, text: 搜索, goto: results }
      hot:       { widget: text, x: 24, y: 312, w: 342, text: 常搜物品 }
      chips:     { widget: segmented, x: 24, y: 352, w: 342, items: [校园卡, 钥匙, 雨伞] }
      note:      { widget: paragraph, x: 24, y: 426, w: 342, text: 可按物品名称搜索，再查看地点、时间与详细特征。 }
  results:
    items:
      nav:       { widget: navbar, x: 0, y: 0, title: 搜索结果, back: true, goto: search }
      query:     { widget: searchbar, x: 24, y: 100, w: 342, text: 校园卡, goto: search }
      count:     { widget: text, x: 24, y: 164, w: 342, text: 找到 2 条与“校园卡”相关的信息 }
      result_1: { widget: button, x: 24, y: 216, w: 342, h: 98, text: "招领 · 校园卡\n图书馆一楼 · 9月25日\n点击查看详情", goto: detail }
      result_2: { widget: button, x: 24, y: 334, w: 342, h: 98, text: "寻物 · 校园卡\n第三教学楼 · 9月24日\n点击查看详情", goto: detail }
      tip:       { widget: paragraph, x: 24, y: 488, w: 342, text: "若无匹配结果，可尝试更短的关键词，\n或发布寻物信息。" }
      publish:   { widget: button, x: 24, y: 580, w: 342, text: 发布寻物信息, goto: publish }
  detail:
    items:
      nav:       { widget: navbar, x: 0, y: 0, title: 信息详情, back: true, goto: home }
      badge:     { widget: badge, x: 24, y: 100, w: 88, text: 招领中 }
      title:     { widget: heading, x: 24, y: 150, w: 342, text: 拾到一张校园卡 }
      picture:   { widget: card, x: 24, y: 216, w: 342, h: 160, text: 物品照片占位图 }
      category:  { widget: text, x: 24, y: 404, w: 342, text: 物品类别：校园卡 }
      place:     { widget: text, x: 24, y: 454, w: 342, text: 拾取地点：图书馆一楼服务台附近 }
      time:      { widget: text, x: 24, y: 504, w: 342, text: 拾取时间：9月25日 15:30 }
      desc:      { widget: paragraph, x: 24, y: 554, w: 342, text: "卡片已交图书馆服务台保管。\n请失主描述卡面信息后领取，避免冒领。" }
      contact:   { widget: button, x: 24, y: 690, w: 342, text: 查看领取方式, goto: contact }
  contact:
    items:
      nav:       { widget: navbar, x: 0, y: 0, title: 领取方式, back: true, goto: detail }
      title:     { widget: heading, x: 24, y: 114, w: 342, text: 请到服务台核对领取 }
      msg:       { widget: paragraph, x: 24, y: 194, w: 342, text: "地点：图书馆一楼服务台。\n领取时说明校园卡上的姓名或学号。\n原型中的信息仅为演示。" }
      safe:      { widget: alert, x: 24, y: 330, w: 342, text: 不公开完整证件信息，防止冒领。 }
      back:      { widget: button, x: 24, y: 574, w: 342, text: 返回详情, goto: detail }
  publish:
    items:
      nav:       { widget: navbar, x: 0, y: 0, title: 发布信息, back: true, goto: home }
      kind:      { widget: segmented, x: 24, y: 98, w: 342, items: [我要寻物, 我要招领] }
      name:      { widget: input, x: 24, y: 166, w: 342, label: 物品名称, placeholder: 例如 校园卡 }
      type:      { widget: dropdown, x: 24, y: 244, w: 342, label: 物品类别, items: [证件卡片, 钥匙, 电子产品, 其他] }
      when:      { widget: datepicker, x: 24, y: 322, w: 342, label: 丢失或拾取时间 }
      where:     { widget: input, x: 24, y: 400, w: 342, label: 地点, placeholder: 例如 图书馆一楼 }
      detail:    { widget: textarea, x: 24, y: 478, w: 342, h: 92, label: 补充描述, placeholder: 颜色、特征等；不填写完整证件号 }
      method:    { widget: input, x: 24, y: 596, w: 342, label: 联系或领取方式, placeholder: 例如 交至服务台 }
      submit:    { widget: button, x: 24, y: 706, w: 342, text: 确认发布, goto: success }
  success:
    items:
      nav:       { widget: navbar, x: 0, y: 0, title: 发布成功 }
      icon:      { widget: icon, x: 163, y: 154, w: 64, icon: check, color: green }
      title:     { widget: heading, x: 24, y: 248, w: 342, text: 发布成功, align: center }
      msg:       { widget: paragraph, x: 40, y: 316, w: 310, text: "信息已进入校园信息列表。\n物品找到或归还后，记得修改状态。" }
      mine:      { widget: button, x: 24, y: 466, w: 342, text: 查看我的发布, goto: mine }
      home:      { widget: button, x: 24, y: 540, w: 342, text: 返回首页, goto: home }
  mine:
    items:
      nav:       { widget: navbar, x: 0, y: 0, title: 我的发布, back: true, goto: home }
      heading:   { widget: heading, x: 24, y: 114, w: 342, text: 我的信息 }
      state:     { widget: badge, x: 24, y: 180, w: 110, text: 招领中 }
      item:      { widget: card, x: 24, y: 238, w: 342, h: 124, text: "招领 · 校园卡\n图书馆一楼 · 9月25日" }
      finish:    { widget: button, x: 24, y: 396, w: 342, text: 标记为已归还, goto: closed }
      note:      { widget: paragraph, x: 24, y: 476, w: 342, text: "修改状态后，浏览列表会显示“已归还”。\n这样可以减少无效联系。" }
  closed:
    items:
      nav:       { widget: navbar, x: 0, y: 0, title: 状态已更新, back: true, goto: mine }
      title:     { widget: heading, x: 24, y: 188, w: 342, text: 已标记为已归还 }
      msg:       { widget: paragraph, x: 24, y: 272, w: 342, text: 感谢你帮助失物回家。该信息仍可在我的发布中查看。 }
      home:      { widget: button, x: 24, y: 462, w: 342, text: 返回首页, goto: home }
flow:
  - screen: home
  - click: home.card_1
  - click: detail.contact
  - screen: home
  - click: home.search
  - type: { in: query, text: 校园卡 }
  - click: search.search_go
  - click: results.result_1
  - screen: home
  - click: home.publish
  - type: { in: name, text: 校园卡 }
  - click: publish.submit
  - click: success.mine
  - click: mine.finish
